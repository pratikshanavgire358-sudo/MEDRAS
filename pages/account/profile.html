<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MEDRA | Profile Update</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/patient-support.css">
    <link rel="stylesheet" href="../../css/account-menu.css">
</head>
<body>
    <main class="patient-support-page">
        <header class="support-header">
            <a href="../index.html" class="support-brand"><i class="bi bi-heart-pulse-fill"></i> MEDRA</a>
            <nav aria-label="Account navigation">
                <a id="accountDashboardLink" href="../auth/login.html">Dashboard</a>
                <a href="profile.html" aria-current="page">Profile Update</a>
                <a href="settings.html">Account Settings</a>
            </nav>
        </header>
        <section class="support-content" aria-labelledby="profileHeading">
            <div class="support-title">
                <div>
                    <p class="support-eyebrow">ACCOUNT</p>
                    <h1 id="profileHeading">Profile Update</h1>
                    <p>Update the name and contact number on your authenticated MEDRA account.</p>
                </div>
            </div>
            <div id="accountProfileMessage" class="support-message" role="status" aria-live="polite" hidden></div>
            <form id="accountProfileForm" class="support-card family-form">
                <label>
                    <span>Full name <b aria-hidden="true">*</b></span>
                    <input name="full_name" required minlength="2" maxlength="100" autocomplete="name">
                </label>
                <label>
                    <span>Mobile number</span>
                    <input name="mobile" type="tel" maxlength="20" autocomplete="tel">
                </label>
                <label>
                    <span>Email address</span>
                    <input name="email" type="email" readonly aria-describedby="emailHelp">
                    <small id="emailHelp" class="support-muted">Email changes are not available from this page.</small>
                </label>
                <label>
                    <span>Account role</span>
                    <input name="role" readonly>
                </label>
                <div class="family-form-actions">
                    <button id="accountProfileSave" class="support-primary" type="submit"><i class="bi bi-check2"></i> Save profile</button>
                </div>
            </form>
        </section>
    </main>
    <script src="../../js/api.js"></script>
    <script src="../../js/common.js"></script>
    <script src="../../js/account-pages.js"></script>
</body>
</html>
