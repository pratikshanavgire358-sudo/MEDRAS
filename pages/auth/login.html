<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDRA | Portal Authentication</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/auth.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>

<body>

    <main class="center">
        <section class="auth" style="max-width: 680px;">

            <!-- Top bar -->
            <div class="appbar">
                <button type="button" class="btn ghost" onclick="go('home')">
                    ← Back to Home
                </button>
                <button type="button" class="theme" onclick="toggleTheme()">
                    ☾ Dark
                </button>
            </div>

            <div class="auth-header" style="text-align:center; margin-bottom: 24px;">
                <div class="auth-icon" style="font-size: 32px; margin-bottom: 8px;">✚</div>
                <h1>Login to MEDRA</h1>
                <p style="color:var(--muted)">
                    Smart Emergency Response Ecosystem
                </p>
            </div>

            <!-- Avishkar Demo Quick-Login Presets 
            <div style="background: var(--surface2, #eef8f5); border: 1px solid var(--line, #c9e2dc); border-radius: 12px; padding: 16px; margin-bottom: 24px;">
                <div style="font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--green, #06b878); margin-bottom: 8px; text-transform: uppercase;">
                    ⚡ Avishkar Demonstration Quick-Fill
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                    <button type="button" class="btn ghost" style="font-size: 12px; padding: 6px 12px;" onclick="fillDemo('patient')">
                        👤 Patient
                    </button>
                    <button type="button" class="btn ghost" style="font-size: 12px; padding: 6px 12px;" onclick="fillDemo('hospital')">
                        🏥 Hospital
                    </button>
                    <button type="button" class="btn ghost" style="font-size: 12px; padding: 6px 12px;" onclick="fillDemo('ambulance')">
                        🚑 Ambulance

                    <button type="button" class="btn ghost" style="font-size: 12px; padding: 6px 12px;" onclick="fillDemo('admin')">

                    </button>

            </div> -->

            <!-- Unified Secure Login Form -->
            <form id="loginForm">
                <div class="field">
                    <label for="email">Registered Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email address"
                        autocomplete="username"
                        required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required>
                </div>

                <!-- Feedback alert -->
                <div id="loginMessage" style="display:none; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 13px;"></div>

                <button
                    type="submit"
                    class="btn full"
                    id="loginButton"
                    style="font-size: 15px; font-weight: 700; padding: 12px;">
                    Sign In to Dashboard →
                </button>
            </form>

            <div style="margin: 24px 0 16px; text-align: center; border-top: 1px solid var(--line); padding-top: 20px;">
                <p style="color:var(--muted); font-size: 13px;">Or access dedicated role login portals:</p>
            </div>

            <!-- Role Portal Cards -->
            <div class="roles" style="grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px;">
                <div class="role" style="padding: 14px; text-align: center; cursor: pointer;" onclick="window.location.href='patient-login.html'">
                    <div style="font-size: 24px;">👤</div>
                    <strong style="font-size: 13px; display:block; margin: 4px 0;">Patient</strong>
                    <small style="color:var(--muted); font-size: 11px;">Portal</small>
                </div>
                <div class="role" style="padding: 14px; text-align: center; cursor: pointer;" onclick="window.location.href='hospital-login.html'">
                    <div style="font-size: 24px;">🏥</div>
                    <strong style="font-size: 13px; display:block; margin: 4px 0;">Hospital</strong>
                    <small style="color:var(--muted); font-size: 11px;">Portal</small>
                </div>
                <div class="role" style="padding: 14px; text-align: center; cursor: pointer;" onclick="window.location.href='ambulance-login.html'">
                    <div style="font-size: 24px;">🚑</div>
                    <strong style="font-size: 13px; display:block; margin: 4px 0;">Ambulance</strong>
                    <small style="color:var(--muted); font-size: 11px;">Portal</small>
                </div>
                <div class="role" style="padding: 14px; text-align: center; cursor: pointer;" onclick="window.location.href='admin-login.html'">
                    <div style="font-size: 24px;">⚙️</div>
                    <strong style="font-size: 13px; display:block; margin: 4px 0;">Admin</strong>
                    <small style="color:var(--muted); font-size: 11px;">Portal</small>
                </div>
            </div>

            <!-- Registration Link -->
            <p style="text-align:center; color:var(--muted); margin-top:24px; font-size: 13px;">
                Need a new patient account?
                <a href="signup.html" class="green" style="font-weight:700;">Create an account</a>
            </p>

        </section>
    </main>

    <script src="../../js/api.js"></script>
    <script src="../../js/common.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/auth/login.js"></script>

</body>
</html>
