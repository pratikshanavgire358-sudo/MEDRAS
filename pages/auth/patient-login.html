<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDRA | Patient Portal Login</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/auth.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>

<body>

    <main class="center">
        <section class="auth">

            <!-- Back Button -->
            <div class="appbar">
                <button type="button" class="btn ghost" onclick="window.location.href='login.html'">
                    ← Back to Role Selection
                </button>
                <button type="button" class="theme" onclick="toggleTheme()">
                    ☾ Dark
                </button>
            </div>

            <!-- Login Header -->
            <header class="auth-header">
                <div class="auth-icon">👤</div>
                <h1>Patient Portal Login</h1>
                <p>Sign in to your MEDRA patient dashboard, SOS system & medical profile.</p>
            </header>

            <!-- Demo autofill -->
            <div style="background: var(--surface2, #eef8f5); border: 1px solid var(--line, #c9e2dc); border-radius: 10px; padding: 12px; margin-bottom: 20px; display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size: 12px; color: var(--muted);">Avishkar Demo Account</span>
                <button type="button" class="btn ghost" style="font-size: 11px; padding: 4px 10px;" onclick="fillPatientDemo()">
                    ⚡ Auto-Fill Patient
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="field">
                    <label for="email">Patient Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="username"
                        required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>

                <!-- Login Error Message -->
                <p id="loginError" class="error" role="alert" aria-live="polite" hidden></p>

                <!-- Login Button -->
                <button type="submit" class="btn full" id="loginButton">
                    Sign In to Patient Portal →
                </button>
            </form>

            <!-- Registration Link -->
            <p style="text-align: center; margin-top: 20px;">
                New patient to MEDRA?
                <a href="signup.html" class="green">Create an account</a>
            </p>

        </section>
    </main>

    <!-- JavaScript -->
    <script src="../../js/api.js"></script>
    <script src="../../js/common.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/auth/patient-login.js"></script>

</body>
</html>
