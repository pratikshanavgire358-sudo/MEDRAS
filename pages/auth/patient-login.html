<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEDRA | Patient Login</title>

    <!-- MEDRA Stylesheets -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/auth.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>

<body>

    <main class="center">
        <section class="auth">

            <!-- Back Button -->
            <div class="appbar">
                <button
                    type="button"
                    class="btn ghost"
                    onclick="window.location.href='login.html'">
                    ← Back
                </button>
            </div>

            <!-- Login Header -->
            <header class="auth-header">
                <div class="auth-icon">👤</div>

                <h1>Patient Login</h1>

                <p>
                    Sign in securely to access your MEDRA patient dashboard.
                </p>
            </header>

            <!-- Login Form -->
            <form id="loginForm">

                <div class="field">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="username"
                        required>
                </div>

                <div class="field">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>

                <!-- Login Error Message -->
                <p
                    id="loginError"
                    class="error"
                    role="alert"
                    aria-live="polite"
                    hidden>
                </p>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn full"
                    id="loginButton">
                    Login to MEDRA →
                </button>

            </form>

            <!-- Registration Link -->
            <p style="text-align: center; margin-top: 20px;">
                New to MEDRA?
                <a href="signup.html" class="green">
                    Create an account
                </a>
            </p>

        </section>
    </main>

    <!-- JavaScript -->
    <script src="../../js/common.js"></script>
    <script src="../../js/auth/patient-login.js"></script>

</body>
</html>
