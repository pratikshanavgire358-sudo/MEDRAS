services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: medra-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - medra_mqtt_data:/mosquitto/data
      - medra_mqtt_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  medra_mqtt_data:
  medra_mqtt_log:
